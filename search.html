<html>

<head>
    <meta name="viewPort" content="width=device-width, initial-scale=1.0">
    
    <style>

        body
        {
            background-color: #ffffff;
            min-height: 100vh;
            color: #212121;
        }

        .appContainer
        {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 40px 20px;
            position: relative;
        }

        .weatherContainer
        {
            position: absolute;

            top: 35px;
            right: 35px;

            text-align: right;

            display: flex;
            flex-direction: column;
        }

        .temperature
        {
            display: flex;
            justify-content: flex-end;

            font-size: 32px;
            font-weight: 700;

            line-height: 100%;

            color: #212121;
        }

        .location
        {
            display: flex;
            justify-content: flex-end;
            
            font-size: 20px;
            font-weight: 700;

            line-height: 100%;

            color: #6e6cdf;
        }

        .centerContainer
        {
            display: flex;
            flex-direction: column;
            align-items: center;

            width: 100%;
            max-width: 700px;
        }

        .topContainer
        {
            display: flex;
            flex-direction: column;
            align-items: center;

            gap: 9.28px;

            margin-bottom: 55.65px;
        }

        .bottomContainer
        {
            display: flex;
            flex-direction: column;
            align-items: center;

            width: 621.45px;
            height: 185.75px;
        }

        .clock
        {
            font-size: 74px;
            font-weight: 700;

            line-height: 100%;

            color: #212121;
        }

        .greetings
        {
            font-size: 36px;
            font-weight: 700;

            line-height: 100%;

            color: #6e6cdf;
        }

        .searchingForm
        {
            display: flex;
            align-items: flex-start;

            width: 621.45px;
            height: 65.1px;

            border-radius: 18.55px;
            border: 1.16px solid #eeeeee;

            padding: 18.55px 27.83px 18.55px 27.83px;
            gap: 9.28px;


            background-color: #fafafa;
        }

        .searhIcon
        {
            width: 24px;
            height: 24px;
        }

        .searchInput
        {
            border: none;
            background: transparent;
            outline: none;
            font-size: 16px;
            flex: 1;
            color: #212121;
        }

        .appDock ul {
            display: flex;
            align-items: flex-end;

            list-style: none;
            padding: 0;
            margin: 0;

            gap: 27.83px;

            height: 65px;
            width: 621.96px;

            justify-content: center;
        }

        .appDock a
        {
            display: flex;
            align-items: center;
            justify-content: center;

            width: 65px;
            height: 65px;
            
            border-radius: 18.57px;
            border: 1.16px #eeeeee;

            background-color: #fafafa;
        }

        .appDock img
        {
            width: 64px;
            height: 64px;
        }

    </style>

</head>    

<body>
    

    <main class="appContainer">

        <header class="weatherContainer">

            <div class="temperature">
                36°
            </div>

            <div class="location">
                Ahmedabad
            </div>

        </header>

        <section class="centerContainer">
            
            <div class="topContainer">
                <div class="clock">
                    09:11:01
                </div>

                <div class="greetings">
                    Good morning, Saad.
                </div>
            </div>

            <div class="bottomContainer">
                <form class="searchingForm">
                    <img src="icons/search-01.svg" alt="" class="searhIcon">
                    <input type="text" placeholder="Search" class="searchInput">
                </form>

                <nav class="appDock">
                    <ul>
                        <li> 
                            <a href="https://www.youtube.com">
                                <img src="icons/YouTube.svg" alt="YouTube">
                            </a>
                        </li>

                        <li>
                            <a href="https://chatgpt.com">
                                <img src="icons/ChatGPT.svg" alt="ChatGPT">
                            </a>
                        </li>

                        <li>
                            <a href="https://www.geeksforgeeks.org">
                                <img src="icons/GC.svg" alt="nissan">
                            </a>
                        </li>

                        <li> 
                            <a href="https://chat.deepseek.com">
                                <img src="icons/deepseek.svg" alt="deepseek">
                            </a>
                        </li>

                        <li>
                            <a href="https://github.com">
                                <img src="icons/github.svg" alt="gitHub">
                            </a>
                        </li>

                        <li>
                            <a href="https://www.linkedin.com">
                                <img src="icons/LI.svg" alt="mihoyo">
                            </a>
                        </li>

                        <li>
                            <a href="link" class="addApp">
                                +
                            </a>
                        </li>
                    </ul>
                </nav>
            </div>

        </section>
            

    </main>
</body>

</html>
